<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>倚盟電訊 · 盤點後台</title>
<style>
:root{
  --bg:#EBEDF0; --surface:#FFF; --panel:#FAFBFC;
  --ink:#14171C; --muted:#6B7280; --line:#D9DCE1;
  --ok:#0E7A4B; --ok-bg:#E4F4EC;
  --bad:#C0281E; --bad-bg:#FCE9E7;
  --extra:#A45B00; --extra-bg:#FDF0DF;
  --wait-bg:#F2F3F5; --accent:#1F3A5F;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
.wrap{max-width:1020px;margin:0 auto;padding:10px}
@media (min-width:980px){ .wrap{max-width:1120px;padding:16px} }

.brand{display:flex;align-items:center;gap:13px;background:var(--panel);
       border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.logo{flex:none;display:block;height:34px;width:auto}
.bsep{width:1px;align-self:stretch;background:var(--line);margin:1px 0}
.btitle{flex:1;min-width:0}
.btitle h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.03em}
.bmeta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px;font-size:11.5px;color:var(--muted)}
.bmeta b{color:var(--accent);font-weight:700}
.logout{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input[type=month],.bar input[type=text]{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 15px;font-weight:700;color:var(--ink)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:active{opacity:.85}

/* 五店狀態 */
.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}
.st{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff}
.st.done{border-color:var(--ok);background:var(--ok-bg)}
.st.part{border-color:var(--extra);background:var(--extra-bg)}
.st.part .st-s{color:var(--extra)}
.st.none{background:var(--wait-bg)}
.st-n{font-size:16px;font-weight:800;letter-spacing:.04em}
.st-s{font-size:12px;margin-top:5px;line-height:1.6;color:var(--muted)}
.st.done .st-s{color:var(--ok)}
.st-d{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}

.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{background:#F5F6F8;text-align:left;font-size:11.5px;color:var(--muted);
         padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:10px 8px;border-bottom:1px solid #EDEFF2;font-size:13.5px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F7F9FC}
.c-num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.part{background:var(--extra-bg);color:var(--extra)}
.money.minus{color:var(--bad);font-weight:700}
.money.plus{color:var(--extra);font-weight:700}
.empty{padding:34px;text-align:center;color:var(--muted)}

/* 明細 */
.ov{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);padding:12px;overflow:auto}
.ov.show{display:block}
.ov-in{background:#fff;border-radius:14px;padding:16px;max-width:900px;margin:4vh auto}
.ov-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.ov-head h2{margin:0;font-size:19px}
.ov-head .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.kpi span{display:block;font-size:11px;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums}
.kpi.k-ok b{color:var(--ok)} .kpi.k-bad b{color:var(--bad)} .kpi.k-ex b{color:var(--extra)}
.sec{font-size:14px;font-weight:800;margin:16px 0 7px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{background:var(--accent);color:#fff;padding:7px 8px;text-align:left;font-weight:700}
.dt td{border-bottom:1px solid #E7EAEE;padding:7px 8px}
.notebox{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--wait-bg);
         font-size:13.5px;min-height:46px;white-space:pre-wrap}
.rstar{color:#C9A24B;letter-spacing:2px;font-size:15px}
tr.rtot td{font-weight:700;background:#F5F6F8}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.sign{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:#fff}
.sign .role{font-size:12px;color:var(--muted)}
.sign .nm{font-size:15px;font-weight:700;margin:2px 0 6px}
.sign img{max-width:100%;height:84px;object-fit:contain}
.ov-foot{display:flex;gap:8px;margin-top:16px}
.ov-foot .btn{flex:1;padding:13px}

/* 登入 */
.gate{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);
      border-radius:14px;padding:26px 22px;text-align:center}
.gate img{height:40px;margin-bottom:14px}
.gate h2{margin:0 0 4px;font-size:18px}
.gate p{margin:0 0 16px;font-size:13px;color:var(--muted)}
.gate input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;
            text-align:center;font-size:18px;letter-spacing:.1em;margin-bottom:10px}
.gate button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);
             color:#fff;font-size:16px;font-weight:700}
.gate .rem{display:flex;align-items:center;justify-content:center;gap:7px;
           margin:2px 0 14px;font-size:13.5px;color:var(--muted);cursor:pointer}
.gate .rem input{width:18px;height:18px;margin:0;padding:0;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
#toast{position:fixed;left:12px;right:12px;bottom:14px;background:#2B3444;color:#fff;
       border-radius:11px;padding:13px 15px;font-size:14px;display:none;z-index:80}
#toast.show{display:block}
@media (min-width:980px){#toast{left:auto;right:22px;max-width:400px}}

@media print{
  body{background:#fff}
  .brand,.card,.tbl,.stores,.ov-foot,#toast,.bar{display:none!important}
  .ov{position:static;display:block!important;background:none;padding:0;overflow:visible}
  .ov-in{margin:0;max-width:none;padding:0;border-radius:0}
  .ov-head .btn{display:none}
  .dt{font-size:11px} .dt th{background:#1F3864!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .kpi,.sign,.notebox{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 portrait;margin:12mm}
}
</style>
</head>

const HQ_URL = 'https://script.google.com/macros/s/AKfycbwnsnO4i_suaxmv3OiOLUZvvYkpFhl4R4--HQO7_lBreKE3xqjs8Vorh2Icc5IxwOooEQ/exec';   // 例:https://script.google.com/macros/s/AKfy.../exec

const STORES = ['鼎山店','陽明店','後昌店','仁雄店','凱旋店'];
let TOKEN = '', ROWS = [], ALL = [];

/* ── 登入 ── */
function login(){
  const v = document.getElementById('pw').value.trim();
  if(!v){ document.getElementById('gateErr').textContent='請輸入通關密語'; return; }
  TOKEN = v;
  document.getElementById('gateErr').textContent='連線中…';
  const keep = (document.getElementById('rem')||{}).checked !== false;
  api('ping').then(()=>{
    try{
      if(keep) localStorage.setItem('hqtk', TOKEN);
      else     localStorage.removeItem('hqtk');
      sessionStorage.setItem('hqtk', TOKEN);
    }catch(e){}
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='';
    const d=new Date();
    document.getElementById('mon').value = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    load();
  }).catch(e=>{
    TOKEN='';
    document.getElementById('gateErr').textContent = String(e.message||e);
  });
}
function logout(){
  TOKEN='';
  try{ sessionStorage.removeItem('hqtk'); localStorage.removeItem('hqtk'); }catch(e){}
  location.reload();
}

/* ── 連線 ── */
async function api(action, extra){
  if(!HQ_URL) throw new Error('這個頁面還沒設定後台網址');
  const q = new URLSearchParams(Object.assign({action, token:TOKEN}, extra||{}));
  const res = await fetch(HQ_URL + '?' + q.toString());
  if(!res.ok) throw new Error('連不到後台（' + res.status + '）');
  const j = await res.json();
  if(!j.ok) throw new Error(j.err || '後台回報失敗');
  return j;
}

/* ── 日期：一律顯示成中文習慣的 2026/10/19，不要英文 ── */
function p2(n){ return String(n).length<2 ? '0'+n : String(n); }
function dparse(x){
  if(x==null || x==='') return null;
  if(x instanceof Date) return isNaN(x.getTime()) ? null : x;
  if(typeof x === 'number'){ const d=new Date(x); return isNaN(d.getTime())?null:d; }
  const s = String(x).trim();
  if(!s) return null;
  /* 帶時區的 ISO（…Z 或 +08:00）交給瀏覽器換算成台灣時間 */
  if(/(Z|[+\-]\d{2}:?\d{2})$/.test(s) && /\d{2}:\d{2}/.test(s)){
    const d = new Date(s); if(!isNaN(d.getTime())) return d;
  }
  /* 2026/10/19 或 2026-10-19，後面可能跟 10:18 */
  const m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3], m[4]?+m[4]:0, m[5]?+m[5]:0);
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function fdate(x){                       /* 2026/10/19 */
  const d = dparse(x);
  return d ? d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())
           : String(x==null?'':x).trim();
}
function ftime(x){                       /* 10/19 10:18 */
  const d = dparse(x);
  return d ? p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())
           : String(x==null?'':x).trim();
}
function ts(x){ const d=dparse(x); return d ? d.getTime() : 0; }
function minTxt(n){
  n = Number(n)||0;
  if(n < 60) return n + ' 分';
  const h = Math.floor(n/60), m = n%60;
  return h + ' 小時' + (m ? ' ' + m + ' 分' : '');
}

/* ── 列表 ── */
async function load(){
  const m = document.getElementById('mon').value;       // yyyy-mm
  const tb = document.getElementById('tb'), em = document.getElementById('empty');
  tb.innerHTML=''; em.style.display='block'; em.textContent='載入中…';
  try{
    /* 全部拿回來再在這邊篩月份:試算表會把日期存成日期格式,
       交給後端用文字比大小會對不上,所以統一在這裡處理 */
    const j = await api('list');
    let rows = j.rows || [];
    rows.forEach(r=>{
      r._t = ts(r['上傳時間']);
      r['盤點日期'] = fdate(r['盤點日期']);
      r['上傳時間'] = ftime(r['上傳時間']);
    });
    /* 新到舊 */
    rows.sort((a,b)=> b._t - a._t);
    /* 同一店同一天重傳過 → 只留最新那份 */
    const seen = {};
    rows = rows.filter(r=>{
      const k = r['門市'] + '|' + r['盤點日期'];
      if(seen[k]) return false;
      seen[k] = 1; return true;
    });
    ALL = rows.slice();
    if(m){
      const key = m.replace('-','/');            // 2026-10 → 2026/10
      rows = rows.filter(r => r['盤點日期'].slice(0,7) === key);
    }
    ROWS = rows;
    paintStores(); paintTable();
    document.getElementById('mMonth').textContent = m ? m.replace('-','年')+'月' : '全部';
    document.getElementById('mCount').innerHTML = '已收到 <b>'+ROWS.length+'</b> 份';
    document.getElementById('lastSync').textContent =
      '更新於 ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    em.textContent = String(e.message||e);
    toast(String(e.message||e));
  }
}

function paintStores(){
  const box=document.getElementById('stores');
  const latest={};
  ROWS.forEach(r=>{ const s=r['門市']; if(!latest[s]) latest[s]=r; });   // ROWS 已是新到舊
  box.innerHTML = STORES.map(s=>{
    const r=latest[s];
    if(!r) return '<div class="st none"><div class="st-n">'+s+'</div>'
                 + '<div class="st-s">本月還沒上傳</div></div>';
    const done=Number(r['已盤品項'])||0, base=Number(r['應盤品項'])||0;
    const full = base && done>=base;
    const wait=Number(r['未盤到'])||0;
    /* 沒盤到也是差異：電腦有、現場找不到 */
    const bad=(Number(r['有差異'])||0)+wait;
    return '<div class="st '+(full?'done':'part')+'"><div class="st-n">'+s+'</div>'
      + '<div class="st-s">'+(full?'✓ 盤完並上傳':'只盤了一部分（'+done+'/'+base+'）')
      + '　差異 '+bad+' 項'+(wait?'（含沒盤到 '+wait+'）':'')+'</div>'
      + '<div class="st-d">'+esc(r['盤點日期'])+'　'+esc(r['盤點人'])+'</div></div>';
  }).join('');
}

function paintTable(){
  const tb=document.getElementById('tb'), em=document.getElementById('empty');
  if(!ROWS.length){
    tb.innerHTML=''; em.style.display='block';
    if(ALL.length){
      em.innerHTML = '這個月還沒有門市上傳。<br><span style="font-size:13px">'
        + '後台一共有 <b>'+ALL.length+'</b> 份紀錄，日期分別是 '
        + [...new Set(ALL.map(r=>r['盤點日期'].slice(0,7)))].join('、')
        + '。</span><br><button class="btn" style="margin-top:12px" onclick="showAll()">顯示全部紀錄</button>';
    }else{
      em.innerHTML = '後台目前一份紀錄都沒有。<br><span style="font-size:13px">'
        + '如果門市有按過上傳，先檢查 Apps Script 的通關密語跟這裡是不是同一組。</span>';
    }
    return;
  }
  em.style.display='none';
  tb.innerHTML = ROWS.map((r,i)=>{
    const done=Number(r['已盤品項'])||0, base=Number(r['應盤品項'])||0;
    const full = base && done>=base;
    const wait=Number(r['未盤到'])||0;
    const bad=(Number(r['有差異'])||0)+wait;      /* 沒盤到也算差異 */
    const net=Number(r['淨差異金額'])||0;
    return '<tr onclick="openDetail(\''+esc(r['紀錄編號'])+'\')">'
      + '<td><b>'+esc(r['門市'])+'</b></td>'
      + '<td>'+esc(r['盤點日期'])+'</td>'
      + '<td style="font-size:12px;color:var(--muted)">'+esc(r['盤點範圍'])+'</td>'
      + '<td>'+esc(r['盤點人'])+'</td>'
      + '<td>'+esc(r['主管'])+'</td>'
      + '<td class="c-num"><span class="tag '+(full?'ok':'part')+'">'+done+'/'+base+'</span></td>'
      + '<td class="c-num">'+(bad? '<span class="tag bad">'+bad+' 項</span>' : '<span class="tag ok">無</span>')+'</td>'
      + '<td class="c-num money '+(net<0?'minus':(net>0?'plus':''))+'">'
      +   (net? (net>0?'+':'') + net.toLocaleString() : '0') + '</td>'
      + '<td style="font-size:12px;color:var(--muted)">'+esc(r['上傳時間'])+'</td></tr>';
  }).join('');
}

/* ── 明細 ── */
async function openDetail(id){
  const ov=document.getElementById('ov'), box=document.getElementById('ovIn');
  box.innerHTML='<div class="empty">載入中…</div>';
  ov.classList.add('show');
  try{
    const j = await api('detail', {id});
    const d=j.data, m=d.main||{};
    const grp = k => d.items.filter(x=>x['類型']===k);
    const diff=grp('差異'), msn=grp('未盤到序號'), ext=grp('清單外'),
          wait=grp('未盤到'), neg=grp('負庫存'), rate=grp('評比');

    const tbl = (head, rows) =>
      '<table class="dt"><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
      + rows.join('') + '</tbody></table>';

    let html = ''
      + '<div class="ov-head"><div>'
      +   '<h2>'+esc(m['門市'])+'　盤點結果</h2>'
      +   '<div class="sub">盤點日 '+esc(fdate(m['盤點日期']))+'　｜　範圍 '+esc(m['盤點範圍'])
      +   '　｜　上傳 '+esc(ftime(m['上傳時間']))+'</div>'
      + '</div><button class="btn" onclick="closeDetail()">關閉</button></div>'

      + '<div class="kpis">'
      +   kpi('應盤品項', m['應盤品項']) + kpi('已盤品項', m['已盤品項'])
      +   kpi('完成率', m['完成率']) + kpi('數量相符', m['數量相符'],'k-ok')
      +   kpi('有差異', (num(m['有差異'])+num(m['未盤到'])),'k-bad')
      +   kpi('其中沒盤到', m['未盤到'], num(m['未盤到'])?'k-bad':'')
      +   kpi('清單外', m['清單外'],'k-ex')
      +   kpi('盤盈件數', '+'+(m['盤盈件數']||0),'k-ex')
      +   kpi('盤虧件數', '-'+(m['盤虧件數']||0),'k-bad')
      +   kpi('淨差異金額', num(m['淨差異金額']).toLocaleString(), num(m['淨差異金額'])<0?'k-bad':'k-ex')
      + '</div>';

    if(diff.length){
      html += '<div class="sec">差異明細（'+diff.length+' 項）</div>'
        + tbl(['大類','商品名稱','商品編號','電腦','實際','差異','金額'],
            diff.map(r=>'<tr><td>'+esc(r['大類'])+'</td><td>'+esc(r['商品名稱'])+'</td>'
              +'<td style="font-family:var(--mono);font-size:11px">'+esc(r['商品編號'])+'</td>'
              +'<td class="c-num">'+esc(r['電腦庫存'])+'</td><td class="c-num">'+esc(r['實際盤點'])+'</td>'
              +'<td class="c-num" style="font-weight:700;color:'+(num(r['差異'])>0?'var(--extra)':'var(--bad)')+'">'
              + (num(r['差異'])>0?'+':'')+esc(r['差異'])+'</td>'
              +'<td class="c-num">'+num(r['差異金額']).toLocaleString()+'</td></tr>'));
    }
    if(msn.length){
      html += '<div class="sec">未盤到序號（'+msn.length+' 支）</div>'
        + tbl(['商品名稱','序號','電腦','實際'],
            msn.map(r=>'<tr><td>'+esc(r['商品名稱'])+'</td>'
              +'<td style="font-family:var(--mono)">'+esc(r['序號'])+'</td>'
              +'<td class="c-num">'+esc(r['電腦庫存'])+'</td><td class="c-num">'+esc(r['實際盤點'])+'</td></tr>'));
    }
    if(ext.length){
      html += '<div class="sec">清單外品項（'+ext.length+' 項）</div>'
        + tbl(['商品名稱','商品編號','實際'],
            ext.map(r=>'<tr><td>'+esc(r['商品名稱'])+'</td>'
              +'<td style="font-family:var(--mono);font-size:11px">'+esc(r['商品編號'])+'</td>'
              +'<td class="c-num">'+esc(r['實際盤點'])+'</td></tr>'));
    }
    if(neg.length){
      html += '<div class="sec">負庫存（'+neg.length+' 項）</div>'
        + tbl(['商品名稱','商品編號','電腦'],
            neg.map(r=>'<tr><td>'+esc(r['商品名稱'])+'</td>'
              +'<td style="font-family:var(--mono);font-size:11px">'+esc(r['商品編號'])+'</td>'
              +'<td class="c-num">'+esc(r['電腦庫存'])+'</td></tr>'));
    }
    if(wait.length){
      html += '<div class="sec">未盤到品項（'+wait.length+' 項）</div>'
        + '<details><summary style="cursor:pointer;color:var(--accent);font-size:13px;margin-bottom:6px">展開看明細</summary>'
        + tbl(['大類','商品名稱','商品編號','電腦'],
            wait.map(r=>'<tr><td>'+esc(r['大類'])+'</td><td>'+esc(r['商品名稱'])+'</td>'
              +'<td style="font-family:var(--mono);font-size:11px">'+esc(r['商品編號'])+'</td>'
              +'<td class="c-num">'+esc(r['電腦庫存'])+'</td></tr>'))
        + '</details>';
    }

    if(rate.length){
      html += '<div class="sec">盤點現場評比</div>'
        + tbl(['項目','評分','分數'], rate.map(r=>{
            const nm = String(r['商品名稱']||'');
            const got = Number(r['實際盤點'])||0, full = Number(r['電腦庫存'])||0;
            if(nm.indexOf('耗時')>=0)
              return '<tr><td>盤點耗時</td><td colspan="2">'+esc(minTxt(got))+'</td></tr>';
            const stars = full===5
              ? '<span class="rstar">'+'★'.repeat(got)+'☆'.repeat(Math.max(0,5-got))+'</span>' : '';
            return '<tr'+(nm==='合計'?' class="rtot"':'')+'><td>'+esc(nm)+'</td>'
              + '<td>'+stars+'</td>'
              + '<td class="c-num">'+got+(full?' / '+full:'')+'</td></tr>';
          }));
    }
    html += '<div class="sec">備註</div>'
      + '<div class="notebox">'+ (m['備註'] ? esc(m['備註']) : '（門市未填）') +'</div>';

    html += '<div class="sec">盤點確認簽名</div><div class="signs">'
      + (d.signs||[]).map(g=>'<div class="sign"><div class="role">'+esc(g['角色'])+'</div>'
          + '<div class="nm">'+esc(g['姓名']||'—')+'</div>'
          + (g['簽名圖'] ? '<img src="'+g['簽名圖']+'" alt="簽名">' : '<div style="color:var(--muted);font-size:12px;padding:30px 0">未簽名</div>')
          + '</div>').join('')
      + '</div>';

    html += '<div class="ov-foot">'
      + '<button class="btn" onclick="closeDetail()">關閉</button>'
      + '<button class="btn go" onclick="window.print()">列印這一份</button></div>';

    box.innerHTML = html;
  }catch(e){
    box.innerHTML = '<div class="empty">'+esc(String(e.message||e))
      + '<br><br><button class="btn" onclick="closeDetail()">關閉</button></div>';
  }
}
function closeDetail(){ document.getElementById('ov').classList.remove('show'); }
function kpi(label, val, cls){
  return '<div class="kpi '+(cls||'')+'"><span>'+label+'</span><b>'+esc(val==null?'':val)+'</b></div>';
}

function showAll(){
  ROWS = ALL.slice();
  document.getElementById('mon').value='';
  document.getElementById('mMonth').textContent='全部';
  document.getElementById('mCount').innerHTML='已收到 <b>'+ROWS.length+'</b> 份';
  paintStores(); paintTable();
}

/* ── 匯出 ── */
function toCsv(){
  if(!ROWS.length){ toast('沒有資料可以匯出'); return; }
  const head=Object.keys(ROWS[0]).filter(k=>k.charAt(0)!=='_');
  const lines=[head.join(',')].concat(ROWS.map(r=>head.map(h=>{
    const v=String(r[h]==null?'':r[h]);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='盤點上傳總覽_'+(document.getElementById('mon').value||'全部')+'.csv';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

/* ── 小工具 ── */
function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(x){ const n=Number(x); return isNaN(n)?0:n; }
let tmr;
function toast(t){
  const el=document.getElementById('toast');
  el.textContent=t; el.classList.add('show');
  clearTimeout(tmr); tmr=setTimeout(()=>el.classList.remove('show'),3600);
}
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeDetail(); });
try{
  let t=null;
  try{ t = localStorage.getItem('hqtk'); }catch(e){}
  if(!t){ try{ t = sessionStorage.getItem('hqtk'); }catch(e){} }
  if(t){ document.getElementById('pw').value=t; login(); }
}catch(e){}
</script>
